label: &element.State.label State
tag: input
attribute:
  type: text
  id: &element.State.attribute.id State
  name: *element.State.attribute.id
  value: ''
  title: *element.State.label
  placeholder: *element.State.label
  minLength: &element.State.attribute.minLength 3
  maxlength: &element.State.attribute.maxlength 50
  autofocus: false
  #autocomplete: true
  required: false
  disabled: false
filter:
  validate:
    minLength:
      value: *element.State.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have successfully made all the necessary information for
          this purpose.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^[\\p{L}\\p{Zs}\\p{Nd}\\p{M}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]+$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.
  sanitize:
    maxlength:
      value: *element.State.attribute.maxlength
    regex:
      value: "/[^\\p{L}\\p{Zs}\\p{Nd}\\p{M}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]/u"