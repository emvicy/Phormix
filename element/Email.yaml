label: &element.Email.label E-mail address
description: &element.Email.description 'E-mail address of the form: foo@example.de'
tag: input
attribute:
  type: email
  id: &element.Email.attribute.id Email
  name: *element.Email.attribute.id
  value: ''
  title: *element.Email.description
  placeholder: *element.Email.label
  minLength: &element.Email.attribute.minLength 5
  maxlength: &element.Email.attribute.maxlength 255
  autofocus: false
  autocomplete: false
  required: true
  disabled: false
filter:
  validate:
    email:
      value:
        checkMX: true
        checkUserExists: false
      message:
        fail: The given e-mail address is not valid.
    empty:
      value: false