label: &element.Street.label Street / Nr
tag: input
attribute:
  type: text
  id: &element.Street.attribute.id Street
  name: *element.Street.attribute.id
  value: ''
  title: *element.Street.label
  placeholder: *element.Street.label
  minLength: &element.Street.attribute.minLength 3
  maxlength: &element.Street.attribute.maxlength 50
  autofocus: false
  autocomplete: false
  required: true
  disabled: false
filter:
  validate:
    minLength:
      value: *element.Street.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have successfully made all the necessary information for this purpose.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^[\\p{L}\\p{Zs}\\p{Nd}\\p{M}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]+$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.
  sanitize:
    maxlength:
      value: *element.Street.attribute.maxlength
    regex:
      value: "/[^\\w\\d\\p{L}\\p{Zs}\\p{Nd}\\p{M}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]/u"