# if you want to use this element config
# consider using MAX_FILE_SIZE element before in your form yaml:
# [..]
# element:
#   - MAX_FILE_SIZE
#   - Upload
#--------------------------------------------
label: &element.Upload.label Upload PDF files
description: 'You can upload files up to 10 MB in size'
tag: input
attribute:
  type: file
  id: &element.Upload.attribute.id Upload
  name: *element.Upload.attribute.id
  value: ''
  multiple: true
  title: *element.Upload.label
  placeholder: *element.Upload.label
  autofocus: false
  autocomplete: false
  required: false
  disabled: false
filter:
  validate:
    filemaxfilesize:
      value: 10485760 # value in Bytes; equals to 10 MB
      message:
        fail: The maximum file size of %s Bytes has been exceeded.
        success: The file size is within the allowed range of %s Bytes.
    filetype:
      value:
        - label: PDF
          value: application/pdf
      message:
        fail: Your upload includes not authorized filetypes
    file:
      value:
      message:
        fail: Uploading files failed due to invalid structure.
