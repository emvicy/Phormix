label:  &element.Password.label Password
description: At least 12, at most 60 characters; at least 1 lower-case letter, 1 upper-case letter, 1 numeral, 1 special character
tag: input
attribute:
  type: password
  id: &element.Password.attribute.id Password
  name: *element.Password.attribute.id
  value: ''
  title: *element.Password.label
  placeholder: *element.Password.label
  minLength: &element.Password.attribute.minLength 12
  maxlength: &element.Password.attribute.maxlength 60
  pattern: '^(?=\S*[\p{Ll}])(?=\S*[\p{Lu}])(?=\S*\d)(?=\S*[^\w\s])\S{12,60}$'
  autofocus: false
  autocomplete: false
  required: true
  disabled: false
filter:
  validate:
    minLength:
      value: *element.Password.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have specified more than the required minimum amount of %s characters.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^(?=\\S*[\\p{Ll}])(?=\\S*[\\p{Lu}])(?=\\S*\\d)(?=\\S*[^\\w\\s])\\S{12,60}$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.