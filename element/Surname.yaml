label:  &element.Surname.label Surname
description:
tag: input
attribute:
  type: text
  id: &element.Surname.attribute.id Surname
  name: *element.Surname.attribute.id
  value: ''
  title: *element.Surname.label
  placeholder: *element.Surname.label
  minLength: &element.Surname.attribute.minLength 3
  maxlength: &element.Surname.attribute.maxlength 50
  autofocus: true
  autocomplete: false
  required: true
  disabled: false
filter:
  validate:
    minLength:
      value: *element.Surname.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have specified more than the required minimum amount of %s characters.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^[\\p{L}\\p{Zs}\\p{M}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]+$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.