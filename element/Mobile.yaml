label: &element.Mobile.label Mobile
description:
tag: input
attribute:
  type: text
  id: &element.Mobile.attribute.id Mobile
  name: *element.Mobile.attribute.id
  value: ''
  title: *element.Mobile.label
  placeholder: *element.Mobile.label
  minLength: &element.Mobile.attribute.minLength 1
  maxlength: &element.Mobile.attribute.maxlength 25
  pattern: "^[\\+0][\\d\\s.]{3,25}$"
  autofocus: false
  autocomplete: false
  required: false
  disabled: false
filter:
  validate:
    minLength:
      value: *element.Mobile.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have specified more than the required minimum amount of %s characters.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^[\\+0][\\d\\s.]{3,25}$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.