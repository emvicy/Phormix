label: &element.Telephone.label Telephone
tag: input
attribute:
  type: text
  id: &element.Telephone.attribute.id Telephone
  name: *element.Telephone.attribute.id
  value: ''
  title: *element.Telephone.label
  placeholder: *element.Telephone.label
  minLength: &element.Telephone.attribute.minLength 1
  maxlength: &element.Telephone.attribute.maxlength 25
  autofocus: false
  #autocomplete: true
  required: false
  disabled: false
filter:
  validate:
    minLength:
      value: *element.Telephone.attribute.minLength
      message:
        fail: Please enter at least %s characters.
        success: You have specified more than the required minimum amount of %s
          characters.
    empty:
      value: false
      message:
        fail: This field can not be empty. Please fill in.
    regex:
      value: "/^[\\p{Nd}\\p{Zs}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]+$/u"
      message:
        fail: Your entry includes not authorized characters
        success: Your entry includes only authorized characters.
  sanitize:
    maxlength:
      value: *element.Telephone.attribute.maxlength
    regex:
      value: "/[^\\w\\d\\p{Zs}\\p{Nd}\\p{Pd}\\p{Ps}\\p{Pe}\\p{Pc}.,]/u"