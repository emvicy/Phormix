form:
  id: &form.id Profile # get the id by calling "*form.id"
  name: Profile
  action: ""
  method: "post"
  enctype: "multipart/form-data" # enabling uploading files
element:
  # names have to match to existing equal named files (without suffix) in $_sElementDirectory (see /Phormix/element/)
  - Salutation
  - Firstname
  - Surname
  - Company
  - Street
  - Postcode
  - City
  - State
  - Country
  - Telephone
  - Fax
  - Mobile
  - Email
  - Description
  - Message
  - Captcha
  # Upload
  - MAX_FILE_SIZE
  - Upload
  - PrivacyPolicy